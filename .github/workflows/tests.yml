name: Analysis checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg
          NUMBA_NUM_THREADS: '1'
      - name: Execute all notebooks on a small synthetic Visium fixture
        run: python tests/smoke_notebooks.py
        env:
          MPLBACKEND: Agg
          NUMBA_NUM_THREADS: '1'
